<!doctype html>
<html lang="ja">
  <body style="font-family: 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif; color: #16324f; line-height: 1.8">

    <p>パスワード再設定の手続きを受け付けました。下のボタンから新しいパスワードを設定してください。</p>
    <p>
      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #0076d1; color: #ffffff; padding: 10px 20px; border-radius: 8px; text-decoration: none">パスワードを再設定する</a>

    <p>ボタンが開けない場合は、次のURLをブラウザに貼り付けてください。<br />{{ .ConfirmationURL }}</p>
    <p>このリンクの有効期限は1時間です。</p>
    <p style="color: #5b6b80; font-size: 12px">この操作に心当たりがない場合は、このメールを破棄してください（パスワードは変更されません）。このメールは送信専用です。</p>
  </body>
