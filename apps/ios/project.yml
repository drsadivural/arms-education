# XcodeGen spec for the ARMS iOS app (`xcodegen generate` in apps/ios).
# The generated ARMS.xcodeproj is not committed; Package.resolved pins the remote packages.
name: ARMS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ARMS/Config/Debug.xcconfig
  Release: ARMS/Config/Release.xcconfig

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ARMSKit:
    path: ARMSKit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0

targets:
  ARMS:
    type: application
    platform: iOS
    sources:
      - path: ARMS
        excludes:
          - "Config/**"
          - "Resources/Info.plist"
          - "Resources/ARMS.entitlements"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: ARMS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ARMS
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: ARMS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ARMS/Resources/ARMS.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: ARMSKit
      - package: WebRTC

  ARMSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ARMSTests
    dependencies:
      - target: ARMS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests

schemes:
  ARMS:
    build:
      targets:
        ARMS: all
        ARMSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ARMSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
