name: Validate ARMS development package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
